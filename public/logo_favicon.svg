<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Trama Network</title>
  <desc>Logo Trama Network — versione favicon, ottimizzata per piccole dimensioni</desc>

  <!-- Linee di connessione più spesse, relativamente, per leggibilità a 16-32px -->
  <g stroke-width="5" fill="none" stroke-linecap="round">
    <line x1="16" y1="44" x2="48" y2="44" stroke="#1565C0"/>
    <line x1="16" y1="44" x2="32" y2="18" stroke="#C62828"/>
    <line x1="48" y1="44" x2="32" y2="18" stroke="#5E35B1"/>
  </g>

  <!-- Nodo top (semplificato: rombo isometrico più piatto) -->
  <g transform="translate(32, 18)">
    <path d="M -10 0 L 0 -6 L 10 0 L 0 6 Z" fill="#E8E6DE" stroke="#2C2C2A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M -10 0 L 0 6 L 0 14 L -10 8 Z" fill="#B4B2A9" stroke="#2C2C2A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 0 6 L 10 0 L 10 8 L 0 14 Z" fill="#888780" stroke="#2C2C2A" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Nodo basso-sinistra -->
  <g transform="translate(16, 44)">
    <path d="M -10 0 L 0 -6 L 10 0 L 0 6 Z" fill="#E8E6DE" stroke="#2C2C2A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M -10 0 L 0 6 L 0 14 L -10 8 Z" fill="#B4B2A9" stroke="#2C2C2A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 0 6 L 10 0 L 10 8 L 0 14 Z" fill="#888780" stroke="#2C2C2A" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Nodo basso-destra -->
  <g transform="translate(48, 44)">
    <path d="M -10 0 L 0 -6 L 10 0 L 0 6 Z" fill="#E8E6DE" stroke="#2C2C2A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M -10 0 L 0 6 L 0 14 L -10 8 Z" fill="#B4B2A9" stroke="#2C2C2A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 0 6 L 10 0 L 10 8 L 0 14 Z" fill="#888780" stroke="#2C2C2A" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>
