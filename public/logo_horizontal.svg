<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200">
  <title>Trama Network</title>
  <desc>Logo orizzontale con testo per header</desc>

  <!-- Icona a sinistra -->
  <g transform="translate(20, 20) scale(0.625)">
    <!-- Linee di connessione -->
    <g stroke-width="12" fill="none" stroke-linecap="round">
      <line x1="68" y1="172" x2="188" y2="172" stroke="#1565C0"/>
      <line x1="68" y1="172" x2="128" y2="72" stroke="#C62828"/>
      <line x1="188" y1="172" x2="128" y2="72" stroke="#5E35B1"/>
    </g>

    <!-- Nodo top -->
    <g transform="translate(128, 72)">
      <path d="M -40 0 L 0 -24 L 40 0 L 0 24 Z" fill="#E8E6DE" stroke="#2C2C2A" stroke-width="4" stroke-linejoin="round"/>
      <path d="M -40 0 L 0 24 L 0 64 L -40 40 Z" fill="#B4B2A9" stroke="#2C2C2A" stroke-width="4" stroke-linejoin="round"/>
      <path d="M 0 24 L 40 0 L 40 40 L 0 64 Z" fill="#888780" stroke="#2C2C2A" stroke-width="4" stroke-linejoin="round"/>
    </g>

    <!-- Nodo basso-sinistra -->
    <g transform="translate(68, 172)">
      <path d="M -40 0 L 0 -24 L 40 0 L 0 24 Z" fill="#E8E6DE" stroke="#2C2C2A" stroke-width="4" stroke-linejoin="round"/>
      <path d="M -40 0 L 0 24 L 0 64 L -40 40 Z" fill="#B4B2A9" stroke="#2C2C2A" stroke-width="4" stroke-linejoin="round"/>
      <path d="M 0 24 L 40 0 L 40 40 L 0 64 Z" fill="#888780" stroke="#2C2C2A" stroke-width="4" stroke-linejoin="round"/>
    </g>

    <!-- Nodo basso-destra -->
    <g transform="translate(188, 172)">
      <path d="M -40 0 L 0 -24 L 40 0 L 0 24 Z" fill="#E8E6DE" stroke="#2C2C2A" stroke-width="4" stroke-linejoin="round"/>
      <path d="M -40 0 L 0 24 L 0 64 L -40 40 Z" fill="#B4B2A9" stroke="#2C2C2A" stroke-width="4" stroke-linejoin="round"/>
      <path d="M 0 24 L 40 0 L 40 40 L 0 64 Z" fill="#888780" stroke="#2C2C2A" stroke-width="4" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Testo a destra -->
  <text x="200" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="600" fill="#2C2C2A">Trama</text>
  <text x="395" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="300" fill="#5F5E5A">Network</text>

  <!-- Linea decorativa sotto al testo (richiama i tre colori della trama) -->
  <g stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="200" y1="130" x2="320" y2="130" stroke="#1565C0"/>
    <line x1="328" y1="130" x2="448" y2="130" stroke="#C62828"/>
    <line x1="456" y1="130" x2="576" y2="130" stroke="#5E35B1"/>
  </g>
</svg>
