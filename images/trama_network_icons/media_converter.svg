<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Media Converter</title>
  <desc>Media converter con simbolo conversione fibra/rame</desc>
  <!-- Ombra -->
  <ellipse cx="64" cy="106" rx="36" ry="4" fill="#2C2C2A" opacity="0.12"/>

  <!-- Simbolo: connettore fibra (cerchio) <-> connettore RJ45 (rettangolo) -->
  <g transform="translate(64, 30)">
    <!-- Lato sinistro: cerchio fibra ottica (cyan) -->
    <circle cx="-14" cy="0" r="6" fill="#00BCD4" stroke="#00626E" stroke-width="1.2"/>
    <circle cx="-14" cy="0" r="2.5" fill="#FFFFFF" stroke="#00626E" stroke-width="0.6"/>

    <!-- Frecce bidirezionali -->
    <g stroke="#5F5E5A" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -6 -3 L 6 -3"/>
      <path d="M 3 -6 L 6 -3 L 3 0"/>
      <path d="M 6 3 L -6 3"/>
      <path d="M -3 0 L -6 3 L -3 6"/>
    </g>

    <!-- Lato destro: RJ45 (rettangolo gold) -->
    <rect x="8" y="-6" width="12" height="12" fill="#FFC107" stroke="#7A5800" stroke-width="1.2" rx="1"/>
    <rect x="10" y="-3" width="8" height="6" fill="#7A5800" rx="0.3"/>
  </g>

  <!-- Linea connessione -->
  <line x1="64" y1="46" x2="64" y2="62" stroke="#888780" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Case Media Converter: piccolo, basso -->
  <g transform="translate(64, 78)">
    <path d="M -28 -6 L 0 -18 L 28 -6 L 0 6 Z" fill="#E8E6DE" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M -28 -6 L 0 6 L 0 22 L -28 10 Z" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 0 6 L 28 -6 L 28 10 L 0 22 Z" fill="#888780" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Connettori sui due lati corti del case -->
    <g transform="translate(-28, -6) skewY(26.5)">
      <!-- Porta SC fibra (cerchio) -->
      <circle cx="6" cy="10" r="1.5" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.4"/>
      <!-- LED -->
      <circle cx="12" cy="12" r="0.8" fill="#1D9E75"/>
      <circle cx="16" cy="14" r="0.8" fill="#FAC775"/>
      <!-- Porta RJ45 -->
      <rect x="20" y="14" width="4" height="3" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.4"/>
    </g>
  </g>
</svg>
