<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>PDU</title>
  <desc>Power Distribution Unit con simbolo presa elettrica</desc>
  <!-- Ombra -->
  <ellipse cx="64" cy="100" rx="48" ry="4" fill="#2C2C2A" opacity="0.12"/>

  <!-- Simbolo presa elettrica sopra -->
  <g transform="translate(64, 30)">
    <!-- Spina/presa stilizzata -->
    <rect x="-12" y="-12" width="24" height="20" fill="#FFC107" stroke="#7A5800" stroke-width="1.5" stroke-linejoin="round" rx="2"/>
    <!-- Due fori della presa -->
    <circle cx="-5" cy="-4" r="2" fill="#7A5800"/>
    <circle cx="5" cy="-4" r="2" fill="#7A5800"/>
    <!-- Bocca sorriso (terra) -->
    <path d="M -3 4 Q 0 6 3 4" stroke="#7A5800" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Linea connessione -->
  <line x1="64" y1="44" x2="64" y2="62" stroke="#888780" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Case PDU: barra orizzontale lunga e stretta -->
  <g transform="translate(64, 76)">
    <path d="M -50 -4 L 0 -18 L 50 -4 L 0 10 Z" fill="#E8E6DE" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M -50 -4 L 0 10 L 0 22 L -50 8 Z" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 0 10 L 50 -4 L 50 8 L 0 22 Z" fill="#888780" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- File di prese sul front (8 prese) -->
    <g transform="translate(-50, -4) skewY(26.5)">
      <g fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.4">
        <circle cx="8" cy="8" r="1.8"/>
        <circle cx="13" cy="9.5" r="1.8"/>
        <circle cx="18" cy="11" r="1.8"/>
        <circle cx="23" cy="12.5" r="1.8"/>
        <circle cx="28" cy="14" r="1.8"/>
        <circle cx="33" cy="15.5" r="1.8"/>
        <circle cx="38" cy="17" r="1.8"/>
        <circle cx="43" cy="18.5" r="1.8"/>
      </g>
      <!-- Punti centrali (i fori) -->
      <g fill="#5F5E5A">
        <circle cx="8" cy="8" r="0.5"/>
        <circle cx="13" cy="9.5" r="0.5"/>
        <circle cx="18" cy="11" r="0.5"/>
        <circle cx="23" cy="12.5" r="0.5"/>
        <circle cx="28" cy="14" r="0.5"/>
        <circle cx="33" cy="15.5" r="0.5"/>
        <circle cx="38" cy="17" r="0.5"/>
        <circle cx="43" cy="18.5" r="0.5"/>
      </g>
    </g>
  </g>
</svg>
