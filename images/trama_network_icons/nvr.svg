<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>NVR</title>
  <desc>Network Video Recorder con simbolo REC + play</desc>
  <!-- Ombra -->
  <ellipse cx="64" cy="110" rx="42" ry="4" fill="#2C2C2A" opacity="0.12"/>

  <!-- Simbolo REC + play -->
  <g transform="translate(64, 30)">
    <!-- Cerchio REC rosso -->
    <circle cx="-9" cy="0" r="9" fill="#C62828" stroke="#7A1818" stroke-width="1.5"/>
    <!-- Triangolo play blu -->
    <path d="M 4 -9 L 18 0 L 4 9 Z" fill="#1565C0" stroke="#0C447C" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Linea connessione -->
  <line x1="64" y1="46" x2="64" y2="62" stroke="#888780" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Case NVR (2U, simile a server con drive bay grandi) -->
  <g transform="translate(64, 80)">
    <path d="M -42 -8 L 0 -24 L 42 -8 L 0 8 Z" fill="#E8E6DE" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M -42 -8 L 0 8 L 0 28 L -42 12 Z" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 0 8 L 42 -8 L 42 12 L 0 28 Z" fill="#888780" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Dettagli front -->
    <g transform="translate(-42, -8) skewY(26.5)">
      <!-- 2 drive bay grandi -->
      <rect x="6" y="6" width="22" height="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5" rx="0.5"/>
      <rect x="6" y="14" width="22" height="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5" rx="0.5"/>
      <!-- LED registrazione rosso -->
      <circle cx="33" cy="10" r="1.3" fill="#C62828"/>
      <!-- LED status -->
      <circle cx="33" cy="18" r="1.3" fill="#1D9E75"/>
      <!-- Display piccolo -->
      <rect x="6" y="23" width="10" height="3" fill="#04342C" rx="0.3"/>
    </g>
  </g>
</svg>
