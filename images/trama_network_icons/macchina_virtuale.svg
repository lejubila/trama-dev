<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Macchina Virtuale</title>
  <desc>Macchina virtuale: case con contorno tratteggiato e badge VM</desc>
  <!-- Ombra viola (per indicare la natura virtuale) -->
  <ellipse cx="64" cy="108" rx="36" ry="3" fill="#5E35B1" opacity="0.15"/>

  <!-- Simbolo sopra: piccolo monitor con codice -->
  <g transform="translate(64, 30)">
    <!-- Cornice monitor -->
    <rect x="-14" y="-12" width="28" height="20" fill="#7F77DD" stroke="#3C1F7A" stroke-width="1.5" rx="1.5"/>
    <!-- Schermo bianco -->
    <rect x="-11" y="-9" width="22" height="14" fill="#FFFFFF" stroke="#3C1F7A" stroke-width="0.5"/>
    <!-- Righe di codice colorato -->
    <line x1="-8" y1="-6" x2="-2" y2="-6" stroke="#5E35B1" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="0" y1="-6" x2="6" y2="-6" stroke="#1D9E75" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="-8" y1="-3" x2="3" y2="-3" stroke="#5E35B1" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="-8" y1="0" x2="-2" y2="0" stroke="#FFC107" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="8" y2="0" stroke="#5E35B1" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="-8" y1="3" x2="5" y2="3" stroke="#5E35B1" stroke-width="0.8" stroke-linecap="round"/>
    <!-- Cursore -->
    <rect x="6" y="2" width="1.5" height="2" fill="#1D9E75"/>
  </g>

  <!-- Linea connessione viola tratteggiata -->
  <line x1="64" y1="46" x2="64" y2="64" stroke="#7F77DD" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Case VM con contorno tratteggiato (natura virtuale) -->
  <g transform="translate(64, 80)">
    <path d="M -30 -8 L 0 -24 L 30 -8 L 0 8 Z"
          fill="#E8E6DE" stroke="#7F77DD" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="3 2"/>
    <path d="M -30 -8 L 0 8 L 0 28 L -30 12 Z"
          fill="#B4B2A9" stroke="#7F77DD" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="3 2"/>
    <path d="M 0 8 L 30 -8 L 30 12 L 0 28 Z"
          fill="#888780" stroke="#7F77DD" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="3 2"/>

    <!-- Badge "VM" sul front -->
    <g transform="translate(-30, -8) skewY(26.5)">
      <rect x="10" y="12" width="14" height="6" fill="#5E35B1" stroke="#3C1F7A" stroke-width="0.5" rx="0.5"/>
      <text x="17" y="16.5" font-family="Arial, sans-serif" font-size="4" font-weight="bold" fill="#FFFFFF" text-anchor="middle">VM</text>
    </g>
  </g>
</svg>
