<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Computer</title>
  <desc>Postazione computer con monitor desktop e tastiera</desc>
  <!-- Ombra -->
  <ellipse cx="64" cy="116" rx="42" ry="4" fill="#2C2C2A" opacity="0.12"/>

  <!-- ============ MONITOR ============ -->
  <g transform="translate(64, 56)">
    <!-- Lato destro -->
    <path d="M 34 -28 L 34 4 L 16 -4 L 16 -36 Z" fill="#888780" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- TOP cornice -->
    <path d="M -34 -18 L 16 -36 L 34 -28 L -16 -10 Z" fill="#E8E6DE" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Cornice fronte -->
    <path d="M -34 -18 L 16 -36 L 16 -4 L -34 14 Z" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Schermo interno -->
    <path d="M -29 -16 L 12 -30 L 12 -8 L -29 6 Z" fill="#0C447C" stroke="#04223F" stroke-width="0.8" stroke-linejoin="round"/>
    <!-- Finestre sul desktop -->
    <path d="M -25 -12 L -8 -18 L -8 -4 L -25 2 Z" fill="#1565C0" opacity="0.8"/>
    <path d="M -6 -18 L 9 -23 L 9 -10 L -6 -5 Z" fill="#5BAFEC" opacity="0.7"/>

    <!-- Collo monitor -->
    <path d="M -6 6 L 6 2 L 6 14 L -6 18 Z" fill="#888780" stroke="#5F5E5A" stroke-width="1"/>
    <!-- Piedistallo -->
    <path d="M -14 18 L 14 10 L 18 12 L -10 20 Z" fill="#5F5E5A" stroke="#2C2C2A" stroke-width="1" stroke-linejoin="round"/>
  </g>

  <!-- ============ TASTIERA ============ -->
  <g transform="translate(64, 100)">
    <!-- Base tastiera -->
    <path d="M -38 4 L 24 -6 L 38 -2 L -24 8 Z" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Lato spessore -->
    <path d="M 24 -6 L 38 -2 L 38 0 L 24 -4 Z" fill="#888780" stroke="#5F5E5A" stroke-width="1"/>
    <path d="M -24 8 L 38 -2 L 38 0 L -24 10 Z" fill="#888780" stroke="#5F5E5A" stroke-width="1"/>

    <!-- File di tasti (stilizzati come linee bianche) -->
    <g transform="skewY(-9)" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round">
      <line x1="-34" y1="3" x2="22" y2="3" opacity="0.9"/>
      <line x1="-34" y1="7" x2="22" y2="7" opacity="0.9"/>
      <line x1="-34" y1="11" x2="22" y2="11" opacity="0.9"/>
    </g>
  </g>
</svg>
