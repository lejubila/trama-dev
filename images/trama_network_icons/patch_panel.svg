<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Patch Panel</title>
  <desc>Patch panel con griglia di porte caratteristica</desc>
  <!-- Ombra -->
  <ellipse cx="64" cy="106" rx="44" ry="4" fill="#2C2C2A" opacity="0.12"/>

  <!-- Simbolo: griglia di connettori sopra -->
  <g transform="translate(64, 30)">
    <g fill="#7F77DD" stroke="#3C3489" stroke-width="0.8" stroke-linejoin="round">
      <rect x="-18" y="-8" width="6" height="6" rx="0.5"/>
      <rect x="-9" y="-8" width="6" height="6" rx="0.5"/>
      <rect x="0" y="-8" width="6" height="6" rx="0.5"/>
      <rect x="9" y="-8" width="6" height="6" rx="0.5"/>
      <rect x="-18" y="1" width="6" height="6" rx="0.5"/>
      <rect x="-9" y="1" width="6" height="6" rx="0.5"/>
      <rect x="0" y="1" width="6" height="6" rx="0.5"/>
      <rect x="9" y="1" width="6" height="6" rx="0.5"/>
    </g>
  </g>

  <!-- Linea connessione -->
  <line x1="64" y1="46" x2="64" y2="60" stroke="#888780" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Case Patch Panel: striscia 1U larga, simile a switch ma con porte dense -->
  <g transform="translate(64, 76)">
    <path d="M -44 -6 L 0 -22 L 44 -6 L 0 10 Z" fill="#E8E6DE" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M -44 -6 L 0 10 L 0 24 L -44 8 Z" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 0 10 L 44 -6 L 44 8 L 0 24 Z" fill="#888780" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Numeri/etichette colonne sul front + porte fitte -->
    <g transform="translate(-44, -6) skewY(26.5)">
      <!-- Etichette numeriche piccole (linee bianche sottili) -->
      <line x1="6" y1="5" x2="38" y2="5" stroke="#FFFFFF" stroke-width="0.6"/>
      <!-- 2 file di porte (12 colonne) -->
      <g fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.3">
        <!-- Fila 1 -->
        <rect x="6" y="8" width="2.5" height="3"/>
        <rect x="9" y="9" width="2.5" height="3"/>
        <rect x="12" y="10" width="2.5" height="3"/>
        <rect x="15" y="11" width="2.5" height="3"/>
        <rect x="18" y="12" width="2.5" height="3"/>
        <rect x="21" y="13" width="2.5" height="3"/>
        <rect x="24" y="14" width="2.5" height="3"/>
        <rect x="27" y="15" width="2.5" height="3"/>
        <rect x="30" y="16" width="2.5" height="3"/>
        <rect x="33" y="17" width="2.5" height="3"/>
        <rect x="36" y="18" width="2.5" height="3"/>
        <!-- Fila 2 -->
        <rect x="6" y="14" width="2.5" height="3"/>
        <rect x="9" y="15" width="2.5" height="3"/>
        <rect x="12" y="16" width="2.5" height="3"/>
        <rect x="15" y="17" width="2.5" height="3"/>
        <rect x="18" y="18" width="2.5" height="3"/>
        <rect x="21" y="19" width="2.5" height="3"/>
        <rect x="24" y="20" width="2.5" height="3"/>
        <rect x="27" y="21" width="2.5" height="3"/>
        <rect x="30" y="22" width="2.5" height="3"/>
        <rect x="33" y="23" width="2.5" height="3"/>
        <rect x="36" y="24" width="2.5" height="3"/>
      </g>
    </g>
  </g>
</svg>
