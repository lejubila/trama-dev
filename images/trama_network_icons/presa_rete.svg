<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Presa di rete a muro</title>
  <desc>Presa di rete doppia a muro con due porte RJ45</desc>
  <!-- Ombra -->
  <ellipse cx="64" cy="108" rx="42" ry="4" fill="#2C2C2A" opacity="0.12"/>

  <g transform="translate(64, 64)">

    <!-- ============ PLACCA ============ -->
    <!-- Placca TOP (cornice spessa visibile dall'alto) -->
    <path d="M -38 -45 L 42 -35 L 37 -32 L -43 -42 Z"
          fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Placca SIDE sinistra -->
    <path d="M -38 -45 L -43 -42 L -43 38 L -38 35 Z"
          fill="#888780" stroke="#5F5E5A" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Placca SIDE inferiore -->
    <path d="M 37 35 L -43 25 L -43 38 L 37 48 Z"
          fill="#888780" stroke="#5F5E5A" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Fronte placca -->
    <path d="M -38 -42 L 37 -32 L 37 35 L -38 25 Z"
          fill="#E8E6DE" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- ============ Contenuto interno (inclinato come la placca) ============ -->
    <g transform="skewY(-7.5)">

      <!-- MODULO 1 (sinistra) -->
      <rect x="-26" y="-23" width="22" height="40" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1" rx="0.5"/>
      <!-- Etichetta numerica -->
      <rect x="-22" y="-19" width="14" height="4" fill="#1565C0" stroke="#0C447C" stroke-width="0.5" rx="0.5"/>
      <!-- Porta RJ45 1 -->
      <g transform="translate(-15, 4)">
        <path d="M -7 -4 L 7 -4 L 7 4 L -7 4 Z" fill="#444441" stroke="#2C2C2A" stroke-width="0.7" stroke-linejoin="round"/>
        <path d="M -2 4 L 2 4 L 2 7 L -2 7 Z" fill="#444441" stroke="#2C2C2A" stroke-width="0.5" stroke-linejoin="round"/>
        <g stroke="#FFC107" stroke-width="0.4">
          <line x1="-5" y1="-3" x2="-5" y2="2"/>
          <line x1="-3" y1="-3" x2="-3" y2="2"/>
          <line x1="-1" y1="-3" x2="-1" y2="2"/>
          <line x1="1" y1="-3" x2="1" y2="2"/>
          <line x1="3" y1="-3" x2="3" y2="2"/>
          <line x1="5" y1="-3" x2="5" y2="2"/>
        </g>
      </g>

      <!-- MODULO 2 (destra) -->
      <rect x="4" y="-23" width="22" height="40" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1" rx="0.5"/>
      <!-- Etichetta numerica -->
      <rect x="8" y="-19" width="14" height="4" fill="#1565C0" stroke="#0C447C" stroke-width="0.5" rx="0.5"/>
      <!-- Porta RJ45 2 -->
      <g transform="translate(15, 4)">
        <path d="M -7 -4 L 7 -4 L 7 4 L -7 4 Z" fill="#444441" stroke="#2C2C2A" stroke-width="0.7" stroke-linejoin="round"/>
        <path d="M -2 4 L 2 4 L 2 7 L -2 7 Z" fill="#444441" stroke="#2C2C2A" stroke-width="0.5" stroke-linejoin="round"/>
        <g stroke="#FFC107" stroke-width="0.4">
          <line x1="-5" y1="-3" x2="-5" y2="2"/>
          <line x1="-3" y1="-3" x2="-3" y2="2"/>
          <line x1="-1" y1="-3" x2="-1" y2="2"/>
          <line x1="1" y1="-3" x2="1" y2="2"/>
          <line x1="3" y1="-3" x2="3" y2="2"/>
          <line x1="5" y1="-3" x2="5" y2="2"/>
        </g>
      </g>

    </g>
  </g>
</svg>
