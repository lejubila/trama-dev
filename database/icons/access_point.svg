<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Access Point</title>
  <desc>Access Point Wi-Fi con onde radio concentriche</desc>
  <!-- Ombra -->
  <ellipse cx="64" cy="104" rx="44" ry="4" fill="#2C2C2A" opacity="0.12"/>

  <!-- Onde radio concentriche -->
  <g transform="translate(64, 38)" stroke="#185FA5" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M -8 -2 Q 0 -8 8 -2"/>
    <path d="M -16 -8 Q 0 -22 16 -8"/>
    <path d="M -24 -14 Q 0 -36 24 -14"/>
    <circle cx="0" cy="2" r="2.5" fill="#185FA5" stroke="none"/>
  </g>

  <!-- Case Access Point: dome piatto largo -->
  <g transform="translate(64, 78)">
    <path d="M -42 0 L 0 -20 L 42 0 L 0 20 Z" fill="#E8E6DE" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M -42 0 L 0 20 L 0 28 L -42 8 Z" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 0 20 L 42 0 L 42 8 L 0 28 Z" fill="#888780" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Cerchio LED al centro del top -->
    <ellipse cx="-3" cy="-1" rx="6" ry="3" fill="none" stroke="#5F5E5A" stroke-width="0.8"/>
    <ellipse cx="-3" cy="-1" rx="2.5" ry="1.2" fill="#1D9E75"/>
  </g>
</svg>
