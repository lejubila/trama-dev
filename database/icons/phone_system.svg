<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Centralino telefonico</title>
  <desc>Centralino telefonico PBX/VoIP con simbolo cornetta orizzontale</desc>
  <!-- Ombra -->
  <ellipse cx="64" cy="106" rx="42" ry="4" fill="#2C2C2A" opacity="0.12"/>

  <!-- Cornetta orizzontale (simbolo telefono) -->
  <g transform="translate(64, 30)">
    <!-- Impugnatura centrale -->
    <path d="M -16 -2 Q -18 2 -14 4 L 14 4 Q 18 2 16 -2 Q 14 -4 12 -4 L -12 -4 Q -14 -4 -16 -2 Z"
          fill="#1565C0" stroke="#0C447C" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Auricolare sinistro -->
    <ellipse cx="-18" cy="0" rx="6" ry="7" fill="#1565C0" stroke="#0C447C" stroke-width="1.5"/>
    <circle cx="-18" cy="0" r="3" fill="#0C447C"/>
    <!-- Microfono destro -->
    <ellipse cx="18" cy="0" rx="6" ry="7" fill="#1565C0" stroke="#0C447C" stroke-width="1.5"/>
    <circle cx="18" cy="0" r="3" fill="#0C447C"/>
  </g>

  <!-- Linea connessione -->
  <line x1="64" y1="46" x2="64" y2="62" stroke="#888780" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Case centralino -->
  <g transform="translate(64, 78)">
    <path d="M -42 -8 L 0 -22 L 42 -8 L 0 6 Z" fill="#E8E6DE" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M -42 -8 L 0 6 L 0 22 L -42 8 Z" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 0 6 L 42 -8 L 42 8 L 0 22 Z" fill="#888780" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Porte FXS/FXO sul front -->
    <g transform="translate(-42, -8) skewY(26.5)">
      <rect x="6" y="6" width="3" height="3" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.3"/>
      <rect x="10" y="8" width="3" height="3" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.3"/>
      <rect x="14" y="10" width="3" height="3" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.3"/>
      <rect x="18" y="12" width="3" height="3" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.3"/>
      <rect x="22" y="14" width="3" height="3" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.3"/>
      <rect x="26" y="16" width="3" height="3" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.3"/>
      <!-- Seconda fila -->
      <rect x="6" y="12" width="3" height="3" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.3"/>
      <rect x="10" y="14" width="3" height="3" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.3"/>
      <rect x="14" y="16" width="3" height="3" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.3"/>
      <rect x="18" y="18" width="3" height="3" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.3"/>
      <!-- Display -->
      <rect x="28" y="20" width="8" height="4" fill="#04342C" rx="0.3"/>
      <circle cx="32" cy="22" r="0.8" fill="#1D9E75"/>
    </g>
  </g>
</svg>
