<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Terminale Controllo Accessi</title>
  <desc>Terminale di controllo accessi con simbolo lucchetto</desc>
  <!-- Ombra -->
  <ellipse cx="64" cy="112" rx="32" ry="4" fill="#2C2C2A" opacity="0.12"/>

  <!-- Lucchetto sopra -->
  <g transform="translate(64, 28)">
    <!-- Corpo lucchetto -->
    <rect x="-9" y="-2" width="18" height="14" fill="#FFC107" stroke="#7A5800" stroke-width="1.8" rx="2"/>
    <!-- Arco lucchetto -->
    <path d="M -5 -2 L -5 -7 Q -5 -12 0 -12 Q 5 -12 5 -7 L 5 -2"
          fill="none" stroke="#7A5800" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Buco serratura -->
    <circle cx="0" cy="3" r="1.8" fill="#7A5800"/>
    <line x1="0" y1="3" x2="0" y2="7" stroke="#7A5800" stroke-width="1.2"/>
  </g>

  <!-- Linea connessione -->
  <line x1="64" y1="46" x2="64" y2="60" stroke="#888780" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Case terminale -->
  <g transform="translate(64, 78)">
    <path d="M -22 -10 L 0 -22 L 22 -10 L 0 2 Z" fill="#E8E6DE" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M -22 -10 L 0 2 L 0 38 L -22 26 Z" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 0 2 L 22 -10 L 22 26 L 0 38 Z" fill="#888780" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Dettagli front: lettore RFID + tastiera -->
    <g transform="translate(-22, -10) skewY(28)">
      <!-- Lettore RFID (cerchi concentrici) -->
      <circle cx="9" cy="11" r="5" fill="none" stroke="#1565C0" stroke-width="1.1"/>
      <circle cx="9" cy="11" r="3" fill="none" stroke="#1565C0" stroke-width="0.9"/>
      <circle cx="9" cy="11" r="1.3" fill="#1565C0"/>

      <!-- LED status verde -->
      <circle cx="17" cy="11" r="0.9" fill="#1D9E75"/>

      <!-- Mini tastiera 3x4 -->
      <g fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.3">
        <rect x="3" y="22" width="3" height="2.5" rx="0.3"/>
        <rect x="7" y="23" width="3" height="2.5" rx="0.3"/>
        <rect x="11" y="24" width="3" height="2.5" rx="0.3"/>
        <rect x="3" y="26" width="3" height="2.5" rx="0.3"/>
        <rect x="7" y="27" width="3" height="2.5" rx="0.3"/>
        <rect x="11" y="28" width="3" height="2.5" rx="0.3"/>
        <rect x="3" y="30" width="3" height="2.5" rx="0.3"/>
        <rect x="7" y="31" width="3" height="2.5" rx="0.3"/>
        <rect x="11" y="32" width="3" height="2.5" rx="0.3"/>
        <rect x="7" y="35" width="3" height="2.5" rx="0.3"/>
      </g>
    </g>
  </g>
</svg>
