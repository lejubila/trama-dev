<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Router</title>
  <desc>Router enterprise con simbolo nuvola Internet</desc>
  <!-- Ombra base -->
  <ellipse cx="64" cy="108" rx="42" ry="4" fill="#2C2C2A" opacity="0.12"/>

  <!-- Nuvola Internet -->
  <g transform="translate(64, 30)">
    <path d="M -22 0 Q -28 -2 -28 -8 Q -28 -16 -20 -16 Q -18 -22 -10 -22 Q -2 -22 2 -16 Q 12 -18 16 -10 Q 24 -10 24 -2 Q 24 4 18 6 L -18 6 Q -24 6 -22 0 Z"
          fill="#FFFFFF" stroke="#185FA5" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- Linea connessione tratteggiata -->
  <line x1="64" y1="50" x2="64" y2="68" stroke="#888780" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Case Router (isometrico) -->
  <g transform="translate(64, 80)">
    <path d="M -38 -8 L 0 -24 L 38 -8 L 0 8 Z" fill="#E8E6DE" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M -38 -8 L 0 8 L 0 28 L -38 12 Z" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 0 8 L 38 -8 L 38 12 L 0 28 Z" fill="#888780" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Fascia rossa laterale -->
    <path d="M -38 -8 L -32 -11 L -32 9 L -38 12 Z" fill="#D32F2F" stroke="#7A1818" stroke-width="1" stroke-linejoin="round"/>

    <!-- Display + pulsanti sul front -->
    <g transform="translate(-38, -8) skewY(26.5)">
      <rect x="6" y="10" width="14" height="3" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5" rx="0.3"/>
      <rect x="22" y="14" width="2.5" height="2.5" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.4"/>
      <rect x="26" y="16" width="2.5" height="2.5" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.4"/>
      <rect x="30" y="18" width="2.5" height="2.5" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.4"/>
    </g>
  </g>
</svg>
