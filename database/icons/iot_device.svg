<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Dispositivo IoT</title>
  <desc>Dispositivo IoT con simbolo chip e onde wireless</desc>
  <!-- Ombra -->
  <ellipse cx="64" cy="110" rx="32" ry="4" fill="#2C2C2A" opacity="0.12"/>

  <!-- Simbolo: chip con piedini sopra -->
  <g transform="translate(64, 30)">
    <!-- Chip centrale -->
    <rect x="-10" y="-10" width="20" height="20" fill="#5E35B1" stroke="#3C1F7A" stroke-width="1.8" rx="1.5"/>
    <!-- Piedini chip (4 lati, 3 per lato) -->
    <g fill="#5E35B1" stroke="#3C1F7A" stroke-width="0.8">
      <rect x="-14" y="-6" width="4" height="2"/>
      <rect x="-14" y="-1" width="4" height="2"/>
      <rect x="-14" y="4" width="4" height="2"/>
      <rect x="10" y="-6" width="4" height="2"/>
      <rect x="10" y="-1" width="4" height="2"/>
      <rect x="10" y="4" width="4" height="2"/>
      <rect x="-6" y="-14" width="2" height="4"/>
      <rect x="-1" y="-14" width="2" height="4"/>
      <rect x="4" y="-14" width="2" height="4"/>
      <rect x="-6" y="10" width="2" height="4"/>
      <rect x="-1" y="10" width="2" height="4"/>
      <rect x="4" y="10" width="2" height="4"/>
    </g>
    <!-- Centro chip (cerchio bianco con punto) -->
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" stroke="#3C1F7A" stroke-width="1"/>
    <circle cx="0" cy="0" r="1.3" fill="#5E35B1"/>
  </g>

  <!-- Linea connessione -->
  <line x1="64" y1="50" x2="64" y2="64" stroke="#888780" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Case IoT: piccolo cubo neutro -->
  <g transform="translate(64, 80)">
    <path d="M -22 -10 L 0 -22 L 22 -10 L 0 2 Z" fill="#E8E6DE" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M -22 -10 L 0 2 L 0 22 L -22 14 Z" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 0 2 L 22 -10 L 22 14 L 0 22 Z" fill="#888780" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Onde radio piccole sul front (sensore wireless) -->
    <g transform="translate(-22, -10) skewY(28)" stroke="#5E35B1" stroke-width="0.9" fill="none" stroke-linecap="round">
      <path d="M 8 11 Q 11 9 14 11"/>
      <path d="M 6 15 Q 11 11 16 15"/>
      <circle cx="11" cy="13" r="1" fill="#5E35B1" stroke="none"/>
    </g>
    <!-- LED status verde -->
    <g transform="translate(-22, -10) skewY(28)">
      <circle cx="6" cy="20" r="0.9" fill="#1D9E75"/>
    </g>
  </g>
</svg>
