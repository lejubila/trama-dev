<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Hypervisor</title>
  <desc>Hypervisor: server fisico host con VM stratificate sopra</desc>
  <!-- Ombra -->
  <ellipse cx="64" cy="112" rx="42" ry="4" fill="#2C2C2A" opacity="0.12"/>

  <g transform="translate(64, 80)">
    <!-- 3 VM stratificate sopra il server -->
    <!-- VM 1 (sinistra, viola) -->
    <g transform="translate(-18, -68)">
      <path d="M -14 0 L 0 -8 L 14 0 L 0 8 Z" fill="#A289DD" stroke="#5E35B1" stroke-width="1" stroke-linejoin="round"/>
      <path d="M -14 0 L 0 8 L 0 18 L -14 10 Z" fill="#7F77DD" stroke="#5E35B1" stroke-width="1" stroke-linejoin="round"/>
      <path d="M 0 8 L 14 0 L 14 10 L 0 18 Z" fill="#5E35B1" stroke="#3C1F7A" stroke-width="1" stroke-linejoin="round"/>
    </g>
    <!-- VM 2 (centrale, verde) -->
    <g transform="translate(0, -58)">
      <path d="M -14 0 L 0 -8 L 14 0 L 0 8 Z" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1" stroke-linejoin="round"/>
      <path d="M -14 0 L 0 8 L 0 18 L -14 10 Z" fill="#1D9E75" stroke="#0F6E56" stroke-width="1" stroke-linejoin="round"/>
      <path d="M 0 8 L 14 0 L 14 10 L 0 18 Z" fill="#0F6E56" stroke="#04342C" stroke-width="1" stroke-linejoin="round"/>
    </g>
    <!-- VM 3 (destra, blu) -->
    <g transform="translate(18, -48)">
      <path d="M -14 0 L 0 -8 L 14 0 L 0 8 Z" fill="#5BAFEC" stroke="#0C447C" stroke-width="1" stroke-linejoin="round"/>
      <path d="M -14 0 L 0 8 L 0 18 L -14 10 Z" fill="#1565C0" stroke="#0C447C" stroke-width="1" stroke-linejoin="round"/>
      <path d="M 0 8 L 14 0 L 14 10 L 0 18 Z" fill="#0C447C" stroke="#04223F" stroke-width="1" stroke-linejoin="round"/>
    </g>

    <!-- Linee tratteggiate VM → host -->
    <g stroke="#888780" stroke-width="0.8" stroke-dasharray="2 2" fill="none">
      <line x1="-18" y1="-50" x2="-8" y2="-20"/>
      <line x1="0" y1="-40" x2="0" y2="-20"/>
      <line x1="18" y1="-30" x2="8" y2="-20"/>
    </g>

    <!-- Case server host -->
    <path d="M -42 -8 L 0 -28 L 42 -8 L 0 12 Z" fill="#E8E6DE" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M -42 -8 L 0 12 L 0 32 L -42 12 Z" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 0 12 L 42 -8 L 42 12 L 0 32 Z" fill="#888780" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Dettagli front -->
    <g transform="translate(-42, -8) skewY(26.5)">
      <rect x="6" y="8" width="22" height="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5" rx="0.5"/>
      <rect x="6" y="16" width="22" height="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5" rx="0.5"/>
      <circle cx="33" cy="11" r="1.2" fill="#1D9E75"/>
      <circle cx="33" cy="19" r="1.2" fill="#1D9E75"/>
    </g>
  </g>
</svg>
