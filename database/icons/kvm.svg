<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>KVM</title>
  <desc>KVM switch con simbolo monitor (console)</desc>
  <!-- Ombra -->
  <ellipse cx="64" cy="104" rx="42" ry="4" fill="#2C2C2A" opacity="0.12"/>

  <!-- Mini monitor simbolo sopra -->
  <g transform="translate(64, 30)">
    <!-- Schermo -->
    <rect x="-14" y="-12" width="28" height="18" fill="#444441" stroke="#2C2C2A" stroke-width="1.2" rx="1.5"/>
    <!-- Display interno (verde fosforescente) -->
    <rect x="-11" y="-9" width="22" height="13" fill="#1D9E75" rx="0.5"/>
    <!-- Indicatori sul display -->
    <line x1="-8" y1="-6" x2="-2" y2="-6" stroke="#9FE1CB" stroke-width="0.8"/>
    <line x1="-8" y1="-3" x2="4" y2="-3" stroke="#9FE1CB" stroke-width="0.8"/>
    <line x1="-8" y1="0" x2="0" y2="0" stroke="#9FE1CB" stroke-width="0.8"/>
    <!-- Piedistallo -->
    <rect x="-3" y="6" width="6" height="2" fill="#2C2C2A"/>
    <rect x="-6" y="8" width="12" height="1.5" fill="#2C2C2A" rx="0.5"/>
  </g>

  <!-- Linea connessione -->
  <line x1="64" y1="44" x2="64" y2="62" stroke="#888780" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Case KVM: 1U con porte multiple -->
  <g transform="translate(64, 78)">
    <path d="M -38 -6 L 0 -22 L 38 -6 L 0 10 Z" fill="#E8E6DE" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M -38 -6 L 0 10 L 0 24 L -38 8 Z" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 0 10 L 38 -6 L 38 8 L 0 24 Z" fill="#888780" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Porte multiple sul front (KVM ha porte VGA/USB) -->
    <g transform="translate(-38, -6) skewY(26.5)">
      <!-- Pulsanti selettore canale -->
      <rect x="6" y="6" width="3" height="3" fill="#1D9E75" stroke="#5F5E5A" stroke-width="0.3"/>
      <rect x="10" y="8" width="3" height="3" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.3"/>
      <rect x="14" y="10" width="3" height="3" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.3"/>
      <rect x="18" y="12" width="3" height="3" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.3"/>

      <!-- Display numerico -->
      <rect x="24" y="16" width="8" height="4" fill="#04342C" rx="0.3"/>
      <text x="28" y="20" fill="#1D9E75" font-size="3" font-family="monospace" text-anchor="middle">01</text>
    </g>
  </g>
</svg>
