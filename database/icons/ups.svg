<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>UPS</title>
  <desc>UPS (gruppo di continuità) con simbolo fulmine</desc>
  <!-- Ombra -->
  <ellipse cx="64" cy="116" rx="40" ry="4" fill="#2C2C2A" opacity="0.12"/>

  <!-- Case UPS: tower verticale -->
  <g transform="translate(64, 64)">
    <path d="M -34 -30 L 0 -50 L 34 -30 L 0 -10 Z" fill="#E8E6DE" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M -34 -30 L 0 -10 L 0 50 L -34 30 Z" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 0 -10 L 34 -30 L 34 30 L 0 50 Z" fill="#888780" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Display + fulmine sul front -->
    <g transform="translate(-34, -30) skewY(28)">
      <!-- Display LCD -->
      <rect x="6" y="6" width="22" height="8" fill="#04342C" stroke="#5F5E5A" stroke-width="0.6" rx="0.5"/>
      <!-- Barre carica -->
      <rect x="9" y="9" width="3" height="2" fill="#1D9E75"/>
      <rect x="13" y="9" width="3" height="2" fill="#1D9E75"/>
      <rect x="17" y="9" width="3" height="2" fill="#1D9E75"/>
      <rect x="21" y="9" width="3" height="2" fill="#1D9E75"/>

      <!-- Pulsanti -->
      <circle cx="10" cy="22" r="1.2" fill="none" stroke="#5F5E5A" stroke-width="0.5"/>
      <circle cx="16" cy="22" r="1.2" fill="none" stroke="#5F5E5A" stroke-width="0.5"/>
      <circle cx="22" cy="22" r="1.2" fill="none" stroke="#5F5E5A" stroke-width="0.5"/>

      <!-- Fulmine grande -->
      <path d="M 18 32 L 11 50 L 16 50 L 11 65 L 24 45 L 19 45 L 23 32 Z"
            fill="#FFC107" stroke="#7A5800" stroke-width="0.8" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
