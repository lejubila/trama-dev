<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Telecamera</title>
  <desc>Telecamera di videosorveglianza tipo bullet con lente blu</desc>
  <!-- Ombra -->
  <ellipse cx="64" cy="108" rx="38" ry="4" fill="#2C2C2A" opacity="0.12"/>

  <!-- Cono di visione tratteggiato -->
  <g stroke="#1565C0" stroke-width="1.5" fill="none" stroke-dasharray="2.5 2.5" opacity="0.6">
    <line x1="100" y1="34" x2="118" y2="22"/>
    <line x1="100" y1="34" x2="120" y2="44"/>
  </g>

  <!-- Staffa di supporto a parete -->
  <g transform="translate(40, 78)">
    <!-- Base alla parete -->
    <rect x="-6" y="20" width="14" height="4" fill="#5F5E5A" stroke="#2C2C2A" stroke-width="1" rx="1"/>
    <!-- Braccio verticale -->
    <rect x="-3" y="2" width="6" height="20" fill="#888780" stroke="#2C2C2A" stroke-width="1"/>
    <!-- Snodo -->
    <circle cx="0" cy="0" r="3" fill="#5F5E5A" stroke="#2C2C2A" stroke-width="1"/>
  </g>

  <!-- Corpo telecamera bullet (cilindro isometrico) -->
  <g transform="translate(72, 60)">
    <!-- Cilindro principale -->
    <path d="M -28 -10 L -28 10 Q -28 14 -18 14 L 20 14 Q 28 12 28 0 Q 28 -12 20 -14 L -18 -14 Q -28 -14 -28 -10 Z"
          fill="#E8E6DE" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Ellisse retro (apertura cilindro) -->
    <ellipse cx="-28" cy="0" rx="4" ry="11" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1.5"/>

    <!-- Lente frontale (ellisse scura) -->
    <ellipse cx="28" cy="0" rx="6" ry="13" fill="#2C2C2A" stroke="#1A1918" stroke-width="1.5"/>
    <!-- Lente interna blu -->
    <ellipse cx="29" cy="0" rx="4" ry="9" fill="#1565C0"/>
    <ellipse cx="30" cy="0" rx="2" ry="5" fill="#5BAFEC"/>
    <!-- Riflesso lente -->
    <ellipse cx="29" cy="-4" rx="1" ry="2" fill="#FFFFFF" opacity="0.85"/>

    <!-- Linee di rinforzo sul cilindro -->
    <line x1="-20" y1="-12" x2="-20" y2="12" stroke="#5F5E5A" stroke-width="0.5" opacity="0.4"/>
    <line x1="-10" y1="-13" x2="-10" y2="13" stroke="#5F5E5A" stroke-width="0.5" opacity="0.4"/>

    <!-- LED REC piccolo -->
    <circle cx="-12" cy="-6" r="1.5" fill="#C62828" stroke="#7A1818" stroke-width="0.5"/>
  </g>
</svg>
