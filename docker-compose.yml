services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        UID: "${TRAMA_UID:-1000}"
        GID: "${TRAMA_GID:-1000}"
    container_name: trama-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      PHP_IDE_CONFIG: "serverName=trama"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - trama

  nginx:
    image: nginx:1.27-alpine
    container_name: trama-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - trama

  postgres:
    image: postgres:16-alpine
    container_name: trama-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trama
      POSTGRES_USER: trama
      POSTGRES_PASSWORD: trama_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trama -d trama"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - trama

  redis:
    image: redis:7-alpine
    container_name: trama-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - trama

  mailpit:
    image: axllent/mailpit:latest
    container_name: trama-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - trama

  scheduler:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        UID: "${TRAMA_UID:-1000}"
        GID: "${TRAMA_GID:-1000}"
    container_name: trama-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      - app
    networks:
      - trama

  queue:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        UID: "${TRAMA_UID:-1000}"
        GID: "${TRAMA_GID:-1000}"
    container_name: trama-queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=120"]
    depends_on:
      - app
      - redis
    networks:
      - trama

volumes:
  postgres-data:
  redis-data:

networks:
  trama:
    driver: bridge
